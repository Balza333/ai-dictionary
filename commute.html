<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b101b">
  <title>通勤モード | AI技術辞典</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="audio.css">
  <script src="terms.js" defer></script>
  <script src="commute-media/chapters.js" defer></script>
  <script src="commute.js" defer></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html"><span class="logo">AI✦</span><span>AI技術辞典</span></a><a class="back-link" href="audio.html">← 音声学習へ</a></header>
  <main class="audio-main">
    <h1>通勤モード</h1>
    <p class="audio-lead">全38語の用語名と解説を、1本の音声で聞けます。画面をロックする前に再生を始めてください。</p>
    <section class="audio-player" aria-labelledby="commuteTerm">
      <p id="commutePosition"></p>
      <h2 id="commuteTerm">再生する用語</h2>
      <audio id="commuteAudio" controls preload="metadata" style="width: 100%" aria-label="通勤モードの音声"></audio>
      <div class="audio-transport">
        <button type="button" id="commutePrev">前の用語</button>
        <button type="button" id="commuteNext">次の用語</button>
      </div>
      <p id="commuteStatus" role="status"></p>
    </section>
    <section class="audio-settings" aria-labelledby="commuteSettings">
      <h2 id="commuteSettings">再生設定</h2>
      <div class="audio-fields">
        <label for="commuteRate">再生速度
          <select id="commuteRate"><option value="0.75">0.75倍</option><option value="1" selected>1倍</option><option value="1.25">1.25倍</option><option value="1.5">1.5倍</option><option value="2">2倍</option></select>
        </label>
      </div>
      <p class="audio-help">再生位置と速度は同じブラウザに保存されます。ロック画面の操作は端末とブラウザによって異なります。</p>
    </section>
    <p class="audio-help">AivisSpeech: コハク（ノーマル・非公式の合成音声） ／ <a href="https://hub.aivis-project.com/aivm-models/22e8ed77-94fe-4ef2-871f-a86f94e9a579">モデル v1.1.0</a> ／ <a href="https://github.com/Aivis-Project/ACML/blob/master/ACML-1.0.md">ACML 1.0</a></p>
  </main>
</body>
</html>
